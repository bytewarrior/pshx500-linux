# Build check for every push and pull request: unit tests, the wheel and the
# Debian package (kept as a workflow artifact), and an install test of the
# package on Debian 13.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NFPM_VERSION: "2.43.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "libusb1>=3.0" "numpy>=1.24"
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build packages
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          packaging/build-packages.sh "$version" dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      # With the recommended packages, so that their names are checked too.
      - name: Install the Debian package
        run: |
          apt-get update
          apt-get install -y ./dist/*.deb python3-sounddevice python3-pyside6.qtwidgets

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pshx500 --version
          pshx500 record --help
          test -f /usr/lib/udev/rules.d/70-pshx500.rules
          python3 -c "import sys; sys.path.insert(0, '/usr/lib/pshx500'); \
            from PySide6 import QtWidgets; app = QtWidgets.QApplication([]); \
            from pshx500.gui.mainwindow import MainWindow; MainWindow(); print('GUI ok')"
