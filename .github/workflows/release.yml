# Release: push a version tag, CI builds the Debian package and the Python
# wheel and publishes them as a GitHub Release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match the version in pyproject.toml and pshx500/__init__.py;
# packaging/build-packages.sh stops otherwise.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload assets

jobs:
  packages:
    runs-on: ubuntu-24.04
    env:
      NFPM_VERSION: "2.43.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "libusb1>=3.0" "numpy>=1.24"
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build packages
        # v1.0.0 -> 1.0.0 (Debian versions must not start with "v")
        run: packaging/build-packages.sh "${GITHUB_REF_NAME#v}" dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
